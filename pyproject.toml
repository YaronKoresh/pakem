[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pakem"
version = "2.0.0"
description = "A repository packaging system designed to convert source trees into portable artifacts for analysis, indexing, sharing, and restoration workflows."
readme = "README.md"
license = {text = "GPL-3.0-or-later"}
requires-python = ">=3.10"
authors = [
    {name = "Yaron Koresh"},
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries",
    "Topic :: Utilities",
]
keywords = ["repository", "packer", "xml", "codebase"]
dependencies = [
    "cryptography>=42.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0.2",
    "ruff>=0.15.1",
    "poethepoet",
    "pre-commit",
    "build",
    "vulture>=2.10",
]

extra = [
    "pathspec>=0.11.0",
    "tiktoken>=0.4.0",
    "protobuf>=4.0.0",
    "zstandard>=0.23.0",
    "lz4>=4.3.3",
    "dulwich>=0.22.6",
    "fsspec>=2024.6.0",
    "s3fs>=2024.6.0",
    "gcsfs>=2024.6.0",
    "adlfs>=2024.7.0",
    "langchain>=0.3.0",
    "llama-index>=0.12.0",
]

[project.scripts]
pakem = "pakem.cli:main"

[project.urls]
Homepage = "https://github.com/YaronKoresh/pakem"
Repository = "https://github.com/YaronKoresh/pakem"
Issues = "https://github.com/YaronKoresh/pakem/issues"

[tool.setuptools.packages.find]
include = ["pakem*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

# --- RUFF CONFIGURATION ---
[tool.ruff]
target-version = "py310"
line-length = 80

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP"]

ignore = [
    "E501",
    "E402",
    "F401"
]

[tool.ruff.lint.isort]
force-single-line = false
combine-as-imports = true

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.poe.tasks]
check = ["clean", "compile", "dead-code", "strip-comments", "pre-commit", "test", "clean"]

[tool.poe.tasks.test]
cmd = "pytest tests/"

[tool.poe.tasks.compile]
cmd = "python -m compileall -q ."

[tool.poe.tasks.lint]
cmd = "ruff check ."

[tool.poe.tasks.pre-commit]
cmd = "pre-commit run --all-files"

[tool.poe.tasks.pre-commit.env]
SKIP = "no-commit-to-branch"

[tool.poe.tasks.clean]
cmd = "python scripts/clean_workspace.py"

[tool.poe.tasks.strip-comments]
cmd = "python scripts/strip_comments.py"

[tool.poe.tasks.build]
cmd = "python -m build"

[tool.poe.tasks.build-wheel]
cmd = "python -m build --wheel"

[tool.poe.tasks.hook]
cmd = "pre-commit install"

[tool.poe.tasks.format]
cmd = "ruff format ."

[tool.poe.tasks.dead-code]
cmd = "vulture pakem/ --min-confidence 80 --sort-by-size"
